events {
    worker_connections 1024;
}

http {
    map $http_user_agent $loggable {
        default 1;
        "~*UptimeRobot" 0;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /dev/stdout main if=$loggable;
    error_log  /dev/stderr warn;

    # Cloudflare Real IP
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    
    upstream nextjs {
        server chatwave-app:3000;
    }

    upstream socketio {
        server chatwave-app:3001;
    }

    upstream kingplay_api {
        server kingplay-api:5000;
    }

    # HTTP - Redirect all to HTTPS
    server {
        listen 80;
        server_name kingcloud.live www.kingcloud.live api.kingcloud.live;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location ~ /\.(?!well-known).* {
            deny all;
            return 404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name kingcloud.live www.kingcloud.live;
    
        ssl_certificate /etc/letsencrypt/live/kingcloud.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kingcloud.live/privkey.pem;

        location ~ /\.(?!well-known).* {
            deny all;
            return 404;
        }
    
        # Next.js internals (Server Actions / RSC)
        location /_next/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    
        location /_react/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    
        # Main Next.js app
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        # Socket.IO (WebSocket)
        location /socket.io/ {
            proxy_pass http://socketio;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }

    # HTTPS - api.kingcloud.live (KingPlay Backend)
    server {
        listen 443 ssl;
        http2 on;
        server_name api.kingcloud.live;

        ssl_certificate /etc/letsencrypt/live/api.kingcloud.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.kingcloud.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        location ~ /\.(?!well-known).* {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://kingplay_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
